<!DOCTYPE html>
<html>
<head>
    <title>Update Todo</title>
</head>

<body>

    <h1>Update Task</h1>

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="task"
            value="{{ todo.task }}"
            required
        >

        <button type="submit">
            Update
        </button>

    </form>

    <br>

    <a href="{% url 'todo' %}">
        Back to Todo List
    </a>

</body>
</html>
