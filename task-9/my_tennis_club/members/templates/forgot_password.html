<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
</head>

<body>

    <h1>Forgot Password</h1>

    <form method="POST">

        {% csrf_token %}

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >
        <br><br>

        <input type="submit" value="Submit">

    </form>

    <br>

    <a href="{% url 'login' %}">
        Back to Login
    </a>

</body>

</html>
