<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Details</title>
</head>

<body>

    <h1>Welcome to Admin Details</h1>

    <h2>
        Welcome {{ user.first_name }}!
    </h2>

    <p>
        First Name:
        {{ user.first_name }}
    </p>

    <p>
        Last Name:
        {{ user.last_name }}
    </p>

    <p>
        Email:
        {{ user.email }}
    </p>

</body>

</html>
