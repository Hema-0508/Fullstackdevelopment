<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>

<body>

    <h1>Login</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <input
            type="email"
            name="email"
            placeholder="email"
            required
        >
        <br><br>

        <input
            type="password"
            name="password"
            placeholder="password"
            required
        >
        <br><br>

        <input type="submit" value="Login">

    </form>

    <p>
        If you forgot password
        <a href="{% url 'forgot_password' %}">
            click here
        </a>
    </p>

    <p>
        Don't have an account?
        <a href="{% url 'register' %}">
            Register
        </a>
    </p>

</body>

</html>
